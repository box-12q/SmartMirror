<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' file: https://unpkg.com; img-src 'self' data:"
    />
    <title>Gesture Control</title>

    <!-- React via CDN (unpkg) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel standalone for JSX transformation in the browser.
         Pinned to 7.x: Babel 8's react preset emits automatic-runtime
         `import ... from "react/jsx-runtime"` statements which break
         when executed as classic (non-module) scripts. -->
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <link rel="stylesheet" href="./styles/App.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- WindowControls + TitleBar (order matters: TitleBar uses WindowControls) -->
    <script type="text/babel" data-presets="react" src="./components/WindowControls.jsx"></script>
    <script type="text/babel" data-presets="react" src="./components/TitleBar.jsx"></script>
    <!-- Sidebar component (defines window.Sidebar) -->
    <script type="text/babel" data-presets="react" src="./components/Sidebar.jsx"></script>
    <!-- Header component (defines window.Header) -->
    <script type="text/babel" data-presets="react" src="./components/Header.jsx"></script>
    <!-- VideoPlayer placeholder + DetectionToggle (order matters:
         DetectionToggle must be defined before VideoPlayer uses it) -->
    <script type="text/babel" data-presets="react" src="./components/DetectionToggle.jsx"></script>
    <script type="text/babel" data-presets="react" src="./components/VideoPlayer.jsx"></script>
    <!-- App.jsx composes the layout using TitleBar, Sidebar, Header, VideoPlayer -->
    <script type="text/babel" data-presets="react" src="./App.jsx"></script>
    <!-- React entry point -->
    <script type="text/babel" data-presets="react" src="./index.jsx"></script>
  </body>
</html>
